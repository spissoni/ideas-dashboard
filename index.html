<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideas · Seb</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:       #0d1117;
  --sidebar:  #161b22;
  --surface:  #1c2128;
  --surface2: #252d38;
  --border:   #30363d;
  --border2:  #21262d;
  --text:     #e6edf3;
  --text2:    #7d8590;
  --text3:    #484f58;
  --accent:   #7c3aed;
  --accent2:  #2563eb;
  --green:    #3fb950;
  --yellow:   #d29922;
  --red:      #f85149;
  --cyan:     #39c5cf;
  --orange:   #f0883e;
  --pink:     #db61a2;

  --cat-p:  #7c3aed;
  --cat-c:  #0ea5e9;
  --cat-x:  #f59e0b;
  --cat-e:  #10b981;
  --cat-l:  #a855f7;
  --cat-yo: #ec4899;
  --cat-f:  #3b82f6;
  --cat-u:  #14b8a6;
  --cat-v:  #f97316;
  --cat-general: #6b7280;
}

html,body { height:100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 56px;
  background: var(--sidebar);
  border-right: 1px solid var(--border2);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 4px;
  flex-shrink: 0;
  z-index: 10;
}

.sidebar-logo {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  margin-bottom: 16px;
  box-shadow: 0 0 16px rgba(124,58,237,0.3);
}

.nav-item {
  width: 40px; height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text3);
  position: relative;
}

.nav-item:hover { background: var(--surface2); color: var(--text2); }
.nav-item.active { background: rgba(124,58,237,0.15); color: var(--accent); }
.nav-item .tooltip {
  position: absolute;
  left: 48px;
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  white-space: nowrap;
  color: var(--text);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
  z-index: 99;
}
.nav-item:hover .tooltip { opacity: 1; }

.sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }

/* ── MAIN LAYOUT ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── TOPBAR ── */
.topbar {
  height: 52px;
  background: var(--sidebar);
  border-bottom: 1px solid var(--border2);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
}

.topbar-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  flex: 1;
}

.topbar-sub {
  font-size: 11px;
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
}

.search-wrap {
  position: relative;
}

.search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
}

.topbar-search {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px 6px 32px;
  border-radius: 6px;
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  outline: none;
  width: 220px;
  transition: border-color 0.15s;
}

.topbar-search:focus { border-color: var(--accent); }
.topbar-search::placeholder { color: var(--text3); }

.topbar-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text2);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
  white-space: nowrap;
}

.topbar-btn:hover { color: var(--text); border-color: var(--accent); background: rgba(124,58,237,0.08); }

.last-sync {
  font-size: 10px;
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
}

/* ── CONTENT ── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── KPI ROW ── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: all 0.15s;
}

.kpi-card:hover {
  border-color: var(--border);
  background: var(--surface2);
}

.kpi-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.kpi-body {}
.kpi-number {
  font-size: 26px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  line-height: 1;
}
.kpi-label {
  font-size: 11px;
  color: var(--text2);
  margin-top: 3px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ── TWO COL ── */
.two-col {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 12px;
}

/* ── PANEL ── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  overflow: hidden;
}

.panel-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text2);
}

.panel-body { padding: 12px 16px; }

/* ── CATEGORY BREAKDOWN ── */
.cat-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border2);
  cursor: pointer;
  transition: all 0.12s;
}

.cat-row:last-child { border-bottom: none; }
.cat-row:hover { padding-left: 4px; }

.cat-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.cat-name {
  font-size: 12px;
  color: var(--text2);
  flex: 1;
}

.cat-bar-wrap {
  width: 80px;
  height: 4px;
  background: var(--border2);
  border-radius: 2px;
  overflow: hidden;
}

.cat-bar {
  height: 100%;
  border-radius: 2px;
  transition: width 0.5s ease;
}

.cat-count {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text3);
  width: 20px;
  text-align: right;
}

/* ── IDEAS TABLE ── */
.ideas-panel {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.filter-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border2);
  padding: 0 16px;
  overflow-x: auto;
}

.tab-btn {
  background: none;
  border: none;
  color: var(--text3);
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tab-btn:hover { color: var(--text2); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

.tab-count {
  background: var(--surface2);
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
}

.tab-btn.active .tab-count {
  background: rgba(124,58,237,0.2);
  color: var(--accent);
}

/* TABLE */
.table-wrap { overflow-y: auto; flex: 1; max-height: 420px; }
.table-wrap::-webkit-scrollbar { width: 4px; }
.table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

thead {
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 2;
}

thead th {
  padding: 8px 14px;
  text-align: left;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text3);
  border-bottom: 1px solid var(--border2);
  white-space: nowrap;
}

tbody tr {
  border-bottom: 1px solid var(--border2);
  transition: background 0.1s;
  cursor: default;
}

tbody tr:hover { background: var(--surface2); }
tbody tr:last-child { border-bottom: none; }

tbody td {
  padding: 9px 14px;
  color: var(--text2);
  vertical-align: middle;
}

td.idea-text {
  color: var(--text);
  font-size: 13px;
  max-width: 380px;
}

td.idea-text span {
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 500;
  white-space: nowrap;
}

.badge-dot { width: 5px; height: 5px; border-radius: 50%; }

.status-badge.pendiente { background: rgba(210,153,34,0.15); color: #d29922; }
.status-badge.visto     { background: rgba(37,99,235,0.15);  color: #60a5fa; }
.status-badge.hecho     { background: rgba(63,185,80,0.15);  color: #3fb950; }

.cat-badge-sm {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 500;
}

.action-cell { display: flex; gap: 4px; }
.act-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text3);
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 10px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all 0.12s;
}
.act-btn:hover { color: var(--text); border-color: var(--text3); }
.act-btn.v:hover { border-color: #60a5fa; color: #60a5fa; }
.act-btn.h:hover { border-color: #3fb950; color: #3fb950; }

/* EMPTY */
.empty-row td {
  text-align: center;
  padding: 40px;
  color: var(--text3);
  font-size: 13px;
}

/* LOADING */
.loading-row td {
  text-align: center;
  padding: 40px;
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.kpi-pulse { animation: pulse 1.5s ease-in-out infinite; }

/* STATUS FILTERS */
.status-filters {
  display: flex;
  gap: 6px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border2);
  background: var(--bg);
}

.sf-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text3);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all 0.12s;
  display: flex;
  align-items: center;
  gap: 5px;
}

.sf-btn.active.pendiente { border-color: #d29922; color: #d29922; background: rgba(210,153,34,0.08); }
.sf-btn.active.visto     { border-color: #60a5fa; color: #60a5fa; background: rgba(96,165,250,0.08); }
.sf-btn.active.hecho     { border-color: #3fb950; color: #3fb950; background: rgba(63,185,80,0.08); }

.sf-dot { width: 6px; height: 6px; border-radius: 50%; }
.sf-dot.pendiente { background: #d29922; }
.sf-dot.visto     { background: #60a5fa; }
.sf-dot.hecho     { background: #3fb950; }

/* RESPONSIVE */
@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .sidebar { display: none; }
}

@media (max-width: 560px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .content { padding: 12px; }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">💡</div>

  <div class="nav-item active">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span class="tooltip">Dashboard</span>
  </div>

  <div class="nav-item">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
    <span class="tooltip">Destacadas</span>
  </div>

  <div class="nav-item">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span class="tooltip">Recientes</span>
  </div>

  <div class="nav-item">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    <span class="tooltip">Todas</span>
  </div>

  <div class="sidebar-bottom">
    <div class="nav-item">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span class="tooltip">Seb</span>
    </div>
  </div>
</aside>

<!-- MAIN -->
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">
    <div>
      <div class="topbar-title">Panel de Ideas</div>
      <div class="topbar-sub" id="lastSync">sincronizando...</div>
    </div>
    <div style="flex:1"></div>
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="topbar-search" type="text" placeholder="Buscar ideas..." oninput="renderAll()" id="searchInput">
    </div>
    <button class="topbar-btn" onclick="loadData()">
      <span id="refreshIcon">↻</span> Actualizar
    </button>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- KPIs -->
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-icon" style="background:rgba(124,58,237,0.15)">💡</div>
        <div class="kpi-body">
          <div class="kpi-number kpi-pulse" id="kpiTotal" style="color:var(--accent)">—</div>
          <div class="kpi-label">Total ideas</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:rgba(210,153,34,0.15)">⏳</div>
        <div class="kpi-body">
          <div class="kpi-number kpi-pulse" id="kpiPendiente" style="color:var(--yellow)">—</div>
          <div class="kpi-label">Pendientes</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:rgba(63,185,80,0.15)">✅</div>
        <div class="kpi-body">
          <div class="kpi-number kpi-pulse" id="kpiHecho" style="color:var(--green)">—</div>
          <div class="kpi-label">Completadas</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:rgba(37,99,235,0.15)">📅</div>
        <div class="kpi-body">
          <div class="kpi-number kpi-pulse" id="kpiHoy" style="color:#60a5fa">—</div>
          <div class="kpi-label">Hoy</div>
        </div>
      </div>
    </div>

    <!-- TWO COL -->
    <div class="two-col">

      <!-- BREAKDOWN -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Por categoría</span>
          <span style="font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace" id="breakdownTotal">0 ideas</span>
        </div>
        <div class="panel-body" id="catBreakdown">
          <div style="color:var(--text3);font-size:12px;text-align:center;padding:20px;animation:pulse 1.5s infinite">Cargando...</div>
        </div>
      </div>

      <!-- IDEAS TABLE -->
      <div class="ideas-panel">
        <div class="filter-tabs" id="filterTabs">
          <button class="tab-btn active" onclick="setCat('all',this)">Todas <span class="tab-count" id="tc-all">0</span></button>
          <button class="tab-btn" onclick="setCat('p',this)">Proyectos <span class="tab-count" id="tc-p">0</span></button>
          <button class="tab-btn" onclick="setCat('c',this)">Clientes <span class="tab-count" id="tc-c">0</span></button>
          <button class="tab-btn" onclick="setCat('x',this)">Empresa <span class="tab-count" id="tc-x">0</span></button>
          <button class="tab-btn" onclick="setCat('e',this)">Equipo <span class="tab-count" id="tc-e">0</span></button>
          <button class="tab-btn" onclick="setCat('l',this)">Liderazgo <span class="tab-count" id="tc-l">0</span></button>
          <button class="tab-btn" onclick="setCat('yo',this)">Personal <span class="tab-count" id="tc-yo">0</span></button>
          <button class="tab-btn" onclick="setCat('f',this)">Futsal <span class="tab-count" id="tc-f">0</span></button>
          <button class="tab-btn" onclick="setCat('u',this)">UNSAM <span class="tab-count" id="tc-u">0</span></button>
          <button class="tab-btn" onclick="setCat('v',this)">Ver/Leer <span class="tab-count" id="tc-v">0</span></button>
        </div>

        <div class="status-filters">
          <button class="sf-btn active pendiente" onclick="toggleSF('pendiente',this)"><span class="sf-dot pendiente"></span>Pendiente</button>
          <button class="sf-btn active visto"     onclick="toggleSF('visto',this)"><span class="sf-dot visto"></span>Visto</button>
          <button class="sf-btn active hecho"     onclick="toggleSF('hecho',this)"><span class="sf-dot hecho"></span>Hecho</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Idea</th>
                <th>Categoría</th>
                <th>Estado</th>
                <th>Fecha</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="ideasBody">
              <tr class="loading-row"><td colspan="5">Cargando ideas...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTgtLFICDgn1SfetEC4-OiBArhGBHJSPDemvh8LLJ1-22d20CGTV6seE5LeMefvk5pK12JU37znA5s8/pub?gid=0&single=true&output=csv';

const CAT_NAMES = {
  p:'Proyectos clientes',c:'Clientes nuevos',x:'Empresa / producto',
  e:'Equipo',l:'Liderazgo',yo:'Personal',f:'Futsal / Kimberley',
  u:'UNSAM / Handball',v:'Ver / leer',general:'General'
};

const CAT_COLORS = {
  p:'var(--cat-p)',c:'var(--cat-c)',x:'var(--cat-x)',e:'var(--cat-e)',
  l:'var(--cat-l)',yo:'var(--cat-yo)',f:'var(--cat-f)',u:'var(--cat-u)',
  v:'var(--cat-v)',general:'var(--cat-general)'
};

let allIdeas = [];
let catFilter = 'all';
let sfFilters = new Set(['pendiente','visto','hecho']);

function parseCSV(text){
  const lines = text.trim().split('\n');
  if(lines.length<2) return [];
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const cols=lines[i].split(',');
    if(cols.length<5) continue;
    const fecha=cols[0]?.trim()||'';
    const prefijo=cols[1]?.trim()?.toLowerCase()||'general';
    const categoria=cols[2]?.trim()||'General';
    const contenido=cols.slice(3,cols.length-2).join(',').trim().replace(/^"|"$/g,'');
    const estado=cols[cols.length-2]?.trim()?.toLowerCase()||'pendiente';
    if(!contenido||contenido==='/start') continue;
    rows.push({fecha,prefijo,categoria,contenido,estado,id:i});
  }
  return rows.reverse();
}

function isToday(f){
  const t=new Date();
  const d=t.getDate().toString().padStart(2,'0');
  const m=(t.getMonth()+1).toString().padStart(2,'0');
  return f.startsWith(`${d}/${m}/${t.getFullYear()}`);
}

function isUrl(s){ return /^https?:\/\//i.test(s.trim()); }

async function loadData(){
  const icon=document.getElementById('refreshIcon');
  icon.style.transition='transform 0.6s';
  icon.style.transform='rotate(360deg)';
  setTimeout(()=>{icon.style.transform='';icon.style.transition='';},600);
  try{
    const res=await fetch(CSV_URL+'&t='+Date.now());
    const text=await res.text();
    allIdeas=parseCSV(text);
    updateKPIs();
    updateTabs();
    updateBreakdown();
    renderAll();
    document.getElementById('lastSync').textContent='sync '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    document.getElementById('ideasBody').innerHTML='<tr class="empty-row"><td colspan="5">Error al cargar datos</td></tr>';
  }
}

function updateKPIs(){
  document.getElementById('kpiTotal').textContent=allIdeas.length;
  document.getElementById('kpiPendiente').textContent=allIdeas.filter(i=>i.estado==='pendiente').length;
  document.getElementById('kpiHecho').textContent=allIdeas.filter(i=>i.estado==='hecho').length;
  document.getElementById('kpiHoy').textContent=allIdeas.filter(i=>isToday(i.fecha)).length;
  document.querySelectorAll('.kpi-pulse').forEach(el=>el.classList.remove('kpi-pulse'));
}

function updateTabs(){
  const cats=['all','p','c','x','e','l','yo','f','u','v'];
  cats.forEach(cat=>{
    const el=document.getElementById('tc-'+cat);
    if(el) el.textContent=cat==='all'?allIdeas.length:allIdeas.filter(i=>i.prefijo===cat).length;
  });
}

function updateBreakdown(){
  const max=Math.max(...Object.values(
    allIdeas.reduce((acc,i)=>{acc[i.prefijo]=(acc[i.prefijo]||0)+1;return acc;},{})
  ),1);
  const order=['p','c','x','e','l','yo','f','u','v','general'];
  let html='';
  order.forEach(cat=>{
    const count=allIdeas.filter(i=>i.prefijo===cat).length;
    if(count===0) return;
    const pct=Math.round((count/max)*100);
    const color=CAT_COLORS[cat]||'var(--cat-general)';
    html+=`
      <div class="cat-row" onclick="setCatFromBreakdown('${cat}')">
        <span class="cat-dot" style="background:${color}"></span>
        <span class="cat-name">${CAT_NAMES[cat]||cat}</span>
        <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%;background:${color}"></div></div>
        <span class="cat-count">${count}</span>
      </div>`;
  });
  document.getElementById('catBreakdown').innerHTML=html||'<div style="color:var(--text3);font-size:12px;text-align:center;padding:20px">Sin datos aún</div>';
  document.getElementById('breakdownTotal').textContent=allIdeas.length+' ideas';
}

function setCatFromBreakdown(cat){
  catFilter=cat;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const tabs=document.querySelectorAll('.tab-btn');
  tabs.forEach(b=>{ if(b.onclick&&b.onclick.toString().includes(`'${cat}'`)) b.classList.add('active'); });
  renderAll();
}

function setCat(cat,btn){
  catFilter=cat;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function toggleSF(status,btn){
  if(sfFilters.has(status)){
    if(sfFilters.size===1) return;
    sfFilters.delete(status);
    btn.classList.remove('active');
  }else{
    sfFilters.add(status);
    btn.classList.add('active');
  }
  renderAll();
}

function cambiarEstado(id,estado){
  const idea=allIdeas.find(i=>i.id===id);
  if(idea){ idea.estado=estado; updateKPIs(); updateBreakdown(); renderAll(); }
}

function renderAll(){
  const search=document.getElementById('searchInput').value.toLowerCase();
  const filtered=allIdeas.filter(i=>{
    if(catFilter!=='all'&&i.prefijo!==catFilter) return false;
    if(!sfFilters.has(i.estado)) return false;
    if(search&&!i.contenido.toLowerCase().includes(search)&&!i.categoria.toLowerCase().includes(search)) return false;
    return true;
  });

  const tbody=document.getElementById('ideasBody');
  if(filtered.length===0){
    tbody.innerHTML='<tr class="empty-row"><td colspan="5">Sin resultados — probá otro filtro</td></tr>';
    return;
  }

  let html='';
  filtered.forEach(idea=>{
    const p=idea.prefijo||'general';
    const color=`var(--cat-${p})`;
    const contenidoDisplay=isUrl(idea.contenido)
      ?`<a href="${idea.contenido}" target="_blank" style="color:#60a5fa;text-decoration:none">${idea.contenido}</a>`
      :idea.contenido;
    const statusLabels={pendiente:'Pendiente',visto:'Visto',hecho:'Hecho'};
    html+=`<tr>
      <td class="idea-text"><span title="${idea.contenido}">${contenidoDisplay}</span></td>
      <td><span class="cat-badge-sm" style="background:color-mix(in srgb,${color} 15%,transparent);color:${color}">${CAT_NAMES[p]||idea.categoria}</span></td>
      <td><span class="badge status-badge ${idea.estado}"><span class="badge-dot" style="background:currentColor;border-radius:50%;width:5px;height:5px;display:inline-block"></span>${statusLabels[idea.estado]||idea.estado}</span></td>
      <td style="color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:10px;white-space:nowrap">${idea.fecha}</td>
      <td><div class="action-cell">
        <button class="act-btn v" onclick="cambiarEstado(${idea.id},'visto')">visto</button>
        <button class="act-btn h" onclick="cambiarEstado(${idea.id},'hecho')">hecho</button>
      </div></td>
    </tr>`;
  });
  tbody.innerHTML=html;
}

loadData();
setInterval(loadData,120000);
</script>
</body>
</html>
